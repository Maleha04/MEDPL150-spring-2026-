<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Key Is Below</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;

            background-image: url("laughing.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            text-align: center;
        }

        .overlay {
            width: 100%;
            min-height: 100vh;

            background-color: rgba(0, 0, 0, 0.7);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            max-width: 700px;
            padding: 40px;
            font-size: 24px;
            line-height: 2;
        }

        .title {
            color: red;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 0px 0px 15px red;
        }

        .quote {
            color: lightgray;
            font-size: 32px;
            font-style: italic;
            text-shadow: 0px 0px 10px white;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: white;
            text-shadow: 0px 0px 12px red;
        }
    </style>

</head>

<body>

    <div class="overlay">

        <div class="text">

            <p class="title">
                THE KEY IS BELOW
            </p>

            <p class="quote">
                “The key is below.”
            </p>

            <p>
                A cold laugh echoes through the hallway.
            </p>

            <p>
                You hear footsteps getting closer behind you.
            </p>

            <p>
                <a href="the basement stairs.html">
                    💀 GO TO THE BASEMENT
                </a>
            </p>

            <p>
                <a href="interactive story.html">
                    💀 RUN AWAY
                </a>
            </p>

        </div>

    </div>

</body>
</html>
